# Dependabot (GO-04): avisa y abre un PR a develop cuando una librería tiene una versión nueva.
# Los fallos de seguridad conocidos llegan aparte, en cuanto se publican (Settings → Code security).
# Una vez por semana y agrupado: un PR por carpeta, no uno por librería.
version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Madrid
    groups:
      web:
        patterns: ["*"]
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(web)"

  - package-ecosystem: pip
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Madrid
    groups:
      api:
        patterns: ["*"]
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(api)"

  # Las acciones del CI van fijadas por hash: Dependabot las sube de versión con su hash nuevo.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Europe/Madrid
    groups:
      acciones:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
