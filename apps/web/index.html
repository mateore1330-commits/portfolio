<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0E1014" />
    <!-- cabecera:inicio -->
    <!-- Lo de aquí dentro lo sustituye scripts/paginas-estaticas.mjs en el build: cada
         página tiene su título, descripción, enlaces de idioma e imagen para compartir.
         En desarrollo se queda así. -->
    <title>Mateo Rodríguez · Desarrollador Full Stack</title>
    <!-- cabecera:fin -->
    <script>
      // Aplica el tema guardado antes de pintar nada, para que no haya un
      // destello claro al cargar en oscuro. Misma clave que ThemeProvider.
      try {
        var theme = localStorage.getItem('theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
